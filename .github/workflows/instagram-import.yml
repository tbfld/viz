name: Import new Instagram posts

on:
  schedule:
    # Every 6 hours. First run after setup will start backfilling the
    # whole history automatically, in batches (see IG_MAX_PER_RUN).
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-instagram.txt

      - name: Run import
        id: import
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/instagram_import.py

      - name: Commit and push new posts
        run: |
          git config user.name "instagram-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/posts scripts/instagram_state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            count="${{ steps.import.outputs.count }}"
            fixed="${{ steps.import.outputs.fixed }}"
            msg="Instagram import: ${count:-0} new post(s)"
            if [ "${fixed:-0}" != "0" ]; then
              msg="${msg}, fixed image paths in ${fixed} post(s)"
            fi
            git commit -m "$msg"
            git push
          fi
