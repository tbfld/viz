name: Refresh Instagram access token

on:
  schedule:
    # Weekly - well inside the 24h-60day refresh window.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-instagram.txt

      - name: Refresh token and update secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/instagram_refresh_token.py
