name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4

env:
  THEME_NAME: abecedarium

permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Fetch Quartz Theme
        # Pinned to a commit SHA, not `master` - this script runs with
        # write access to what gets deployed, so it shouldn't be able to
        # change under us without a deliberate bump. To pick up a theme
        # update later, check https://github.com/saberzero1/quartz-themes
        # for a newer commit and swap the SHA below on purpose.
        run: curl -s -S https://raw.githubusercontent.com/saberzero1/quartz-themes/44dd81094c0dd982b67f93d91ef8c80da3f583e6/action.sh | bash -s -- $THEME_NAME
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4